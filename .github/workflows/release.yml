name: Ameath Linux Release

on:
  push:
    tags: ["ameath-linux-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Ameath Linux tag (ameath-linux-v*) to publish
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: 01-ameath-linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build wheel
      - run: ./scripts/package_release.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: 01-ameath-linux/release/*
