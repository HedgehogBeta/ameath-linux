name: Ameath Linux CI

on:
  push:
    branches: [main]
    paths:
      - "01-ameath-linux/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "01-ameath-linux/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: 01-ameath-linux
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    needs: test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: 01-ameath-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build wheel
      - run: ./scripts/package_release.sh
      - run: cd release && sha256sum -c SHA256SUMS
      - run: dpkg-deb --field release/*.deb Depends | grep -q x11-utils
