[metadata]
name = ameath-linux
version = 1.1.9.2
description = A feature-complete Linux port of the Ameath desktop pet
maintainer = HedgehogBeta
maintainer_email = 236519605+HedgehogBeta@users.noreply.github.com
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE, SOURCE-LICENSE
url = https://github.com/HedgehogBeta/ameath-linux
project_urls =
    Source = https://github.com/HedgehogBeta/ameath-linux
    Issues = https://github.com/HedgehogBeta/ameath-linux/issues
    Releases = https://github.com/HedgehogBeta/ameath-linux/releases

[options]
packages = find:
python_requires = >=3.10
install_requires =
    PyQt5>=5.15,<6
include_package_data = True

[options.packages.find]
include = ameath_linux*

[options.package_data]
ameath_linux =
    assets/gifs/*
    assets/fonts/*
    assets/sound/music/*
    assets/sound/voice/*

[options.entry_points]
console_scripts =
    ameath-linux = ameath_linux.main:main
